<html>
  <title>Markdown preview</title>
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/3.0.1/github-markdown.min.css"
  />
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.5.1/styles/default.min.css"
  />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.5.1/highlight.min.js"></script>
  <script type="text/javascript">
    document.addEventListener("DOMContentLoaded", (event) => {
      document.querySelectorAll("pre code").forEach((el) => {
        hljs.highlightElement(el);
      });
    });
  </script>

  <script type="text/javascript">
    document.addEventListener("DOMContentLoaded", (event) => {
      class WSBridge {
        constructor(port, actions, initialQueue = []) {
          this.actions = actions;
          this.makeWS = this.makeWS.bind(this);
          this.send = this.send.bind(this);
          this.queue = initialQueue;
          this.ws = this.makeWS(port);
        }
        static build(port, actions) {
          return new WSBridge(port, actions);
        }
        queue = [];
        ws = null;

        actions = {};

        makeWS(port = 7071) {
          const ws = new WebSocket(`ws://localhost:${port}`);
          ws.onopen = () => {
            console.log("Connected");
            while (this.queue.length > 0) {
              ws.send(this.queue.shift());
            }
          };
          ws.onmessage = (wsMsg) => {
            const action = JSON.parse(wsMsg.data);
            const actionType = action.type;
            const handler = this.actions[actionType];
            if (typeof handler === "function") {
              handler(action.payload);
            }
          };
          ws.onclose = (evt) => {
            console.log("WSBridge websocket closed with code", evt.code);
          };
          return ws;
        }

        send(msg) {
          msg = JSON.stringify(msg);
          if (this.ws.readyState === this.ws.CONNECTING) {
            this.queue.push(msg);
          } else if (this.ws.readyState === this.ws.OPEN) {
            this.ws.send(msg);
          }
        }
      }

      const bridge = WSBridge.build(
        7071,
        {
          html(payload) {
            const elem = document.querySelector("article.markdown-body");

            if (elem) {
              elem.innerHTML = payload;
            }
            hljs.highlightAll();
          },
          scroll(scrollYPercent) {
            window.scrollTo(
              0,
              document.documentElement.scrollHeight * scrollYPercent,
            );
          },
        },
        ["getHtml"],
      );
      bridge.send("getHtml");
    });
  </script>
  <body style="max-width: 100%">
    <article
      class="markdown-body"
      style="
        min-width: 400px;
        max-width: 980px;
        box-sizing: border-box;
        margin: 0 auto;
        padding: 45px;
      "
    ></article>
  </body>
</html>
